apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-todo-app
  labels:
    app: devops-todo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-todo-app
  template:
    metadata:
      labels:
        app: devops-todo-app
    spec:
      containers:
      - name: devops-todo-app
        image: devops-todo-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        envFrom:
        - configMapRef:
            name: devops-todo-config
        env:
        - name: PORT
          value: "5000"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
