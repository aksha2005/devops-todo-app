---
- name: Create release directory
  ansible.builtin.file:
    path: "{{ deploy_dir }}"
    state: directory
    mode: "0755"

- name: Copy application files to the host
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../{{ item }}"
    dest: "{{ deploy_dir }}/{{ item }}"
    mode: "0644"
  loop:
    - app.py
    - requirements.txt

- name: Render deployment info from variables
  ansible.builtin.template:
    src: deploy_info.txt.j2
    dest: "{{ deploy_dir }}/deploy_info.txt"
    mode: "0644"

- name: Verify Docker daemon is accessible
  ansible.builtin.command: docker info
  changed_when: false

- name: Verify local Docker image exists
  community.docker.docker_image_info:
    name: "{{ docker_image }}"
  register: docker_image_info

- name: Stop if the required Docker image is missing
  ansible.builtin.assert:
    that:
      - docker_image_info.images | length > 0
    fail_msg: "Required Docker image {{ docker_image }} is not available locally."

- name: Deploy Todo Application Container
  community.docker.docker_container:
    name: "{{ app_name }}"
    image: "{{ docker_image }}"
    state: started
    restart_policy: always
    published_ports:
      - "{{ app_port }}:5000"
    env:
      PORT: "5000"
  notify: Verify Todo Application Health
